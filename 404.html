*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;display:grid;place-items:center;padding:24px;overflow:hidden}
main{position:relative;z-index:2;width:min(880px,100%);text-align:left}
.num{display:flex;align-items:center;justify-content:flex-start;font-weight:800;font-size:clamp(44px,10.4vw,88px);line-height:1;letter-spacing:-.04em}
.num svg{width:.82em;height:.82em;margin:0 -.02em;display:block}
.num svg path{fill:var(--lime)}
.err{margin-right:.3em}
.spin{animation:rot 9s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
h1{margin:.9em 0 0;font-size:16px;line-height:1.2}
.tilt{display:inline-block;background:var(--lime);color:var(--onacc);padding:.04em .22em .1em;transform:rotate(-2deg)}
p{margin:14px 0 0;color:var(--soft);font-size:14px;max-width:32em}
.btn{display:inline-block;margin-top:20px;border:2px solid var(--ink);border-radius:99px;padding:8px 22px;font-size:14px;text-decoration:none;font-weight:700;color:inherit;transition:background .2s,color .2s}
.btn:hover{background:var(--lime);color:var(--onacc);border-color:var(--lime)}
.btn:focus-visible{outline:3px solid var(--pinkd);outline-offset:3px}
.bg{position:fixed;inset:0;pointer-events:none;z-index:1}
.bg svg{position:absolute}
