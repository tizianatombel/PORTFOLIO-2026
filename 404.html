<style>
:root{--bg:#fff;--ink:#3e271f;--soft:#6f564b;--lime:#e2f53b;--pinkd:#e58bbd;--onacc:#3e271f;--line:rgba(62,39,31,.16);--f:"Inter Tight",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;--fs:var(--f);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c110d;--ink:#fdeaf4;--soft:#c9aab9;--line:rgba(253,234,244,.18);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c110d;--ink:#fdeaf4;--soft:#c9aab9;--line:rgba(253,234,244,.18);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-optical-sizing:auto;font-size:17px;line-height:1.55;overflow-x:clip}
.wrap{min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;padding:max(28px,env(safe-area-inset-top,0px)) clamp(20px,4.5vw,64px) max(28px,env(safe-area-inset-bottom,0px))}
.top{display:inline-block;width:40px;height:40px}
.top svg{width:100%;height:100%;display:block;animation:rot 9s linear infinite}
.top path{fill:var(--lime);stroke:var(--ink);stroke-width:5;stroke-linejoin:round}
@keyframes rot{to{transform:rotate(360deg)}}
.num,h1{font-family:var(--fs)}
.num{align-self:center;display:flex;align-items:baseline;flex-wrap:wrap;gap:.12em;font-weight:700;font-size:clamp(40px,7vw,88px);line-height:.9;letter-spacing:-.05em}
.err{font-size:.3em;font-weight:500;letter-spacing:-.04em;margin-right:.3em;color:var(--soft)}
.d{display:inline-flex;align-items:center}
.d svg{width:.74em;height:.74em;margin:0 -.02em;animation:rot 9s linear infinite}
.d path{fill:var(--lime);stroke:var(--ink);stroke-width:4;stroke-linejoin:round}
.foot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:32px;align-items:end;}
h1{margin:0;font-size:clamp(24px,3vw,38px);font-weight:600;letter-spacing:-.025em;line-height:1.1}
.tilt{display:inline-block;background:var(--lime);color:var(--onacc);padding:.04em .18em .08em;transform:rotate(-2deg)}
p{margin:16px 0 0;color:var(--soft);max-width:36em}
.btn{display:inline-block;padding:12px 26px;border:2px solid var(--ink);border-radius:10px;background:var(--ink);color:var(--bg);font-weight:600;text-decoration:none;transition:background .15s,color .15s,border-color .15s}
.btn:hover{background:var(--lime);border-color:var(--lime);color:var(--onacc)}
a:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@media (max-width:700px){.foot{grid-template-columns:1fr}.btn{justify-self:start}}
@media (prefers-reduced-motion:reduce){.top svg,.d svg{animation:none}}
</style>
</head>
