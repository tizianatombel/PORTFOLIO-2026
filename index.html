<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tizi. — Social Media & Community Manager</title>
<style>
:root{--bg:#fff;--ink:#3e271f;--soft:#7b6358;--accent:#f9cde4;--pinkd:#e58bbd;--lime:#e2f53b;--onacc:#3e271f;--tint:#fdeaf4;--nav:#3e271f;--navink:#fdf0f7;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c110d;--ink:#fdeaf4;--soft:#c9aab9;--tint:#34201a;--nav:#120a07;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c110d;--ink:#fdeaf4;--soft:#c9aab9;--tint:#34201a;--nav:#120a07;color-scheme:dark}
html{height:100%;scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:17px;line-height:1.5}
a{color:inherit}
:focus-visible{outline:3px solid var(--pinkd);outline-offset:3px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--nav);color:var(--navink)}
.bar{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 24px}
.logo{font-weight:700;font-size:30px;letter-spacing:-.06em;text-decoration:none;line-height:1;display:flex;align-items:center}
.spin{display:block;width:36px;height:36px;animation:rot 8s linear infinite}
.spin path{fill:var(--lime)}
@keyframes rot{to{transform:rotate(360deg)}}
nav{display:flex;gap:28px;overflow-x:auto}
nav a{font-size:16px;text-decoration:none;padding:4px 0;border-bottom:2px solid transparent;white-space:nowrap;opacity:.85}
nav a.on{border-color:var(--lime);opacity:1}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.05em;line-height:.95}
.hero{position:relative;max-width:1100px;margin:auto;min-height:calc(100svh - 70px);display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:48px;padding:48px 24px 96px}
.ring{position:relative;width:min(100%,400px);aspect-ratio:1;margin:auto}
.ring::before{content:"";position:absolute;inset:10%;border-radius:50%;background:var(--tint);box-shadow:0 0 40px var(--tint)}
.ring svg.t{position:absolute;inset:0;width:100%;height:100%;animation:spin 30s linear infinite}
.ring text{font-size:12.5px;font-weight:700;fill:var(--ink)}
.portrait{position:absolute;inset:17%;border-radius:50%;background:var(--accent);box-shadow:0 0 0 6px var(--lime);display:grid;place-items:center;overflow:hidden;color:#fff}
.portrait img{width:100%;height:100%;object-fit:cover;object-position:center 15%;transform:scale(1.15)}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:clamp(46px,8vw,88px)}
.rule{width:56px;height:3px;background:var(--ink);margin:28px 0 18px}
.role{font-size:clamp(22px,3vw,34px);font-weight:400;letter-spacing:-.04em;line-height:1.4;margin:0}
.role span{background:var(--accent);color:var(--onacc);padding:2px 10px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.page{display:none}.page.on{display:block}#home .w{padding:72px 24px}
.quote{background:var(--tint);padding:56px 24px;text-align:center}
.quote p{max-width:760px;margin:auto;font-size:clamp(20px,2.6vw,28px);letter-spacing:-.03em;line-height:1.25}
.abt{display:grid;grid-template-columns:1.3fr 1fr;gap:48px;align-items:start;margin-top:40px}
.box{border:2px solid var(--pinkd);border-radius:16px;padding:22px}
.box small{display:block;color:var(--ink);font-size:17px;font-weight:700;letter-spacing:-.02em;margin-bottom:10px}
.cv{list-style:none;margin:40px 0 0;padding:0}
.cv li{display:flex;justify-content:space-between;gap:24px;padding:20px 0;border-bottom:1px solid var(--tint);font-size:22px;letter-spacing:-.03em}
.cv span{color:var(--soft);font-size:16px;text-align:right}
.txt p{margin:0 0 20px;font-size:20px;line-height:1.45;max-width:60ch}
.txt b{font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{border:2px solid var(--pinkd);border-radius:99px;padding:5px 14px;font-size:15px}
.btn{display:inline-block;margin-top:12px;border:2px solid var(--ink);border-radius:99px;padding:1
